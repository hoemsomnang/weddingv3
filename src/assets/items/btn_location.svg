<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%" fill="none">
  <defs>
    <!-- Crisp Metallic Gold Gradient -->
    <linearGradient id="goldGradLoc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8f5b0c"/>
      <stop offset="30%" stop-color="#cf9c31"/>
      <stop offset="60%" stop-color="#ffd878"/>
      <stop offset="85%" stop-color="#b88320"/>
      <stop offset="100%" stop-color="#7a4b08"/>
    </linearGradient>

    <!-- Dark Gold Shadow Accent -->
    <linearGradient id="goldDarkLoc" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#693c02"/>
      <stop offset="100%" stop-color="#4a2800"/>
    </linearGradient>
  </defs>

  <!-- Location Map Pin with Center Hole Cutout (Ultra-sharp vector path) -->
  <path fill-rule="evenodd" clip-rule="evenodd"
        d="M 32 7
           C 18.2 7 7 18.2 7 32
           C 7 49 28.5 56.8 31.1 58.6
           C 31.6 59 32.4 59 32.9 58.6
           C 35.5 56.8 57 49 57 32
           C 57 18.2 45.8 7 32 7 Z
           M 32 23
           C 37 23 41 27 41 32
           C 41 37 37 41 32 41
           C 27 41 23 37 23 32
           C 23 27 27 23 32 23 Z"
        fill="url(#goldGradLoc)"
        stroke="url(#goldDarkLoc)"
        stroke-width="1.5"
        stroke-linejoin="round"/>

  <!-- Subtle Inner White Pinpoint Rim for Depth -->
  <circle cx="32" cy="32" r="6" stroke="#ffffff" stroke-width="1.2" opacity="0.8"/>
</svg>
