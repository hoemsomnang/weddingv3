<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%" fill="none">
  <defs>
    <!-- Crisp Metallic Gold Gradient -->
    <linearGradient id="goldGradWish" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8f5b0c"/>
      <stop offset="30%" stop-color="#cf9c31"/>
      <stop offset="60%" stop-color="#ffd878"/>
      <stop offset="85%" stop-color="#b88320"/>
      <stop offset="100%" stop-color="#7a4b08"/>
    </linearGradient>

    <!-- Dark Gold Shadow Accent -->
    <linearGradient id="goldDarkWish" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#693c02"/>
      <stop offset="100%" stop-color="#4a2800"/>
    </linearGradient>
  </defs>

  <!-- Secondary Background Speech Bubble (Top Right) -->
  <path d="M 46 16
           L 52 16
           C 54.8 16 57 18.2 57 21
           L 57 36
           C 57 38.8 54.8 41 52 41
           L 50 41
           L 50 48
           C 50 49.3 48.5 50 47.5 49
           L 39 41
           L 38 41
           C 39.8 39 41 36.5 41 33
           L 41 21
           C 41 18.2 43.2 16 46 16 Z"
        fill="url(#goldGradWish)"
        stroke="url(#goldDarkWish)"
        stroke-width="1.2"
        opacity="0.85"/>

  <!-- Primary Foreground Speech Bubble (Bottom Left) -->
  <path d="M 12 21
           C 9.2 21 7 23.2 7 26
           L 7 43
           C 7 45.8 9.2 48 12 48
           L 18 48
           L 18 56
           C 18 57.3 19.5 58 20.5 57
           L 29.5 48
           L 40 48
           C 42.8 48 45 45.8 45 43
           L 45 26
           C 45 23.2 42.8 21 40 21
           L 12 21 Z"
        fill="url(#goldGradWish)"
        stroke="url(#goldDarkWish)"
        stroke-width="1.5"/>

  <!-- Three Chat Dots Inside Foreground Bubble -->
  <circle cx="17.5" cy="34.5" r="2.5" fill="#ffffff"/>
  <circle cx="26" cy="34.5" r="2.5" fill="#ffffff"/>
  <circle cx="34.5" cy="34.5" r="2.5" fill="#ffffff"/>
</svg>
