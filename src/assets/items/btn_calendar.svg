<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%" fill="none">
  <defs>
    <!-- Crisp Metallic Gold Gradient -->
    <linearGradient id="goldGradCal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8f5b0c"/>
      <stop offset="30%" stop-color="#cf9c31"/>
      <stop offset="60%" stop-color="#ffd878"/>
      <stop offset="85%" stop-color="#b88320"/>
      <stop offset="100%" stop-color="#7a4b08"/>
    </linearGradient>

    <!-- Dark Gold Shadow Accent -->
    <linearGradient id="goldDarkCal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#693c02"/>
      <stop offset="100%" stop-color="#4a2800"/>
    </linearGradient>
  </defs>

  <!-- Calendar Outer Body with Crisp Vector Depth -->
  <rect x="9" y="15" width="46" height="40" rx="8" ry="8"
        fill="url(#goldGradCal)" stroke="url(#goldDarkCal)" stroke-width="1.5"/>

  <!-- Calendar Header Dividing Bar -->
  <line x1="9" y1="26" x2="55" y2="26" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>

  <!-- Top Hanging Binder Loops -->
  <rect x="18" y="7" width="5.5" height="12" rx="2.75"
        fill="url(#goldGradCal)" stroke="url(#goldDarkCal)" stroke-width="1.2"/>
  <rect x="40.5" y="7" width="5.5" height="12" rx="2.75"
        fill="url(#goldGradCal)" stroke="url(#goldDarkCal)" stroke-width="1.2"/>

  <!-- Date Grid Dots (Clean Cutout Circles with Subtle Border for High Clarity) -->
  <!-- Row 1 -->
  <circle cx="21" cy="34.5" r="2.8" fill="#ffffff"/>
  <circle cx="32" cy="34.5" r="2.8" fill="#ffffff"/>
  <circle cx="43" cy="34.5" r="2.8" fill="#ffffff"/>

  <!-- Row 2 -->
  <circle cx="21" cy="44.5" r="2.8" fill="#ffffff"/>
  <circle cx="32" cy="44.5" r="2.8" fill="#ffffff"/>
  <circle cx="43" cy="44.5" r="2.8" fill="#ffffff"/>
</svg>
