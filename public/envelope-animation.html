<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Khmer Wedding Invitation - 3D Envelope Open & Zoom</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Great+Vibes&family=Kantumruy+Pro:wght@300;400;600&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold-primary: #cba34c;
      --gold-light: #fbe39d;
      --gold-dark: #8c681f;
      --bg-dark: #141311;
      --card-cream: #f6f5f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: radial-gradient(circle at 50% 35%, #2a2620 0%, #12110f 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px 15px;
      font-family: 'Montserrat', sans-serif;
      color: #ede7dc;
      overflow-x: hidden;
    }

    .header-bar {
      text-align: center;
      margin-bottom: 24px;
      z-index: 100;
    }

    h1 {
      font-family: 'Cinzel', serif;
      font-size: 20px;
      letter-spacing: 3.5px;
      color: var(--gold-light);
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .hint {
      font-size: 13px;
      color: #a89e8f;
      letter-spacing: 1px;
    }

    /* 3D Scene Container */
    .scene {
      perspective: 1400px;
      width: 100%;
      max-width: 410px;
      aspect-ratio: 9 / 16;
      position: relative;
    }

    .envelope-stage {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 1.2s cubic-bezier(0.25, 1, 0.5, 1);
      cursor: pointer;
    }

    /* Back Wall of the Envelope */
    .envelope-back {
      position: absolute;
      inset: 0;
      background: #eeebe2;
      border-radius: 20px;
      box-shadow: 0 30px 70px rgba(0, 0, 0, 0.65), 0 0 0 1px rgba(255, 255, 255, 0.12);
      overflow: hidden;
      z-index: 1;
    }

    /* Golden Radiance Inside Chamber */
    .inner-glow {
      position: absolute;
      top: 25%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 280px;
      height: 280px;
      background: radial-gradient(circle, rgba(251, 211, 107, 0.65) 0%, rgba(203, 163, 76, 0.25) 50%, transparent 75%);
      opacity: 0;
      transition: opacity 0.8s ease 0.3s;
      pointer-events: none;
      z-index: 2;
    }

    /* ------------------------------------------------------------- */
    /* INNER CARD (Wedding Invitation Card that Slides & Zooms)      */
    /* ------------------------------------------------------------- */
    .inner-card {
      position: absolute;
      top: 15px;
      left: 15px;
      right: 15px;
      bottom: 15px;
      background: #f7f6f2;
      border-radius: 14px;
      z-index: 3;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      transform: translateY(45px) scale(0.92);
      opacity: 0.95;
      transform-origin: center center;
      transition: transform 1.3s cubic-bezier(0.18, 0.9, 0.25, 1), box-shadow 1.3s ease;
    }

    .inner-card-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
    }

    .card-content {
      position: relative;
      z-index: 4;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 50px 24px;
      text-align: center;
      color: #4a4235;
    }

    .card-monogram {
      font-family: 'Cinzel', serif;
      font-size: 24px;
      letter-spacing: 5px;
      color: #9d7b38;
      border: 1px solid #d4af62;
      border-radius: 50%;
      width: 56px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 14px;
      background: rgba(255, 255, 255, 0.7);
      box-shadow: 0 4px 14px rgba(184, 132, 38, 0.2);
    }

    .card-tagline {
      font-family: 'Cinzel', serif;
      font-size: 10.5px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #8c7f6d;
      margin-bottom: 10px;
    }

    .card-couple {
      font-family: 'Great Vibes', cursive;
      font-size: 44px;
      line-height: 1.15;
      color: #93712b;
      margin-bottom: 8px;
      text-shadow: 0 1px 2px rgba(255, 255, 255, 0.85);
    }

    .card-ampersand {
      font-family: 'Cinzel', serif;
      font-size: 18px;
      display: block;
      color: #bfa15f;
      margin: 2px 0;
    }

    .card-khmer {
      font-family: 'Kantumruy Pro', sans-serif;
      font-size: 12.5px;
      color: #6d6455;
      margin: 10px 0 16px;
      letter-spacing: 0.5px;
    }

    .card-divider {
      width: 80px;
      height: 1px;
      background: linear-gradient(90deg, transparent, #c4a768, transparent);
      margin: 12px 0;
    }

    .card-date {
      font-family: 'Cinzel', serif;
      font-size: 12px;
      letter-spacing: 2px;
      color: #635848;
    }

    .card-date-hl {
      font-size: 15px;
      font-weight: 700;
      color: #8f6c24;
      display: block;
      margin: 4px 0;
    }

    /* ------------------------------------------------------------- */
    /* FRONT POCKET (Lower Half)                                     */
    /* ------------------------------------------------------------- */
    .envelope-pocket {
      position: absolute;
      inset: 0;
      z-index: 5;
      pointer-events: none;
      border-radius: 20px;
      overflow: hidden;
      transition: opacity 0.8s ease 0.5s;
    }

    .envelope-pocket img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* ------------------------------------------------------------- */
    /* TOP SCALLOPED FLAP (The 3D Folding Hinge)                     */
    /* ------------------------------------------------------------- */
    .envelope-flap-wrapper {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 52%;
      transform-origin: top center;
      transform-style: preserve-3d;
      transition: transform 1.2s cubic-bezier(0.35, 0, 0.25, 1);
      z-index: 10;
    }

    .flap-face {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      overflow: hidden;
      filter: drop-shadow(0 14px 18px rgba(45, 35, 22, 0.42));
      transition: filter 1.2s ease;
    }

    .flap-face img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top;
      display: block;
    }

    /* Flap Backface (Inner lining revealed when folded back) */
    .flap-back {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(180deg, #dfd8c8 0%, #eee8db 60%, #fff7e4 100%);
      transform: rotateY(180deg) rotateZ(180deg);
      backface-visibility: hidden;
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      border-bottom: 2px solid #caa452;
      box-shadow: inset 0 -15px 30px rgba(184, 142, 48, 0.25);
    }

    /* Center Monogram Seal on Flap */
    .monogram-seal {
      position: absolute;
      bottom: 2%;
      left: 50%;
      transform: translateX(-50%);
      width: 82px;
      height: 82px;
      z-index: 15;
      transition: transform 0.4s ease, opacity 0.6s ease;
      animation: gentle-pulse 3s infinite ease-in-out;
    }

    .monogram-seal img {
      width: 100%;
      height: 100%;
      display: block;
      filter: drop-shadow(0 6px 12px rgba(60, 42, 10, 0.4));
    }

    @keyframes gentle-pulse {
      0%, 100% { transform: translateX(-50%) scale(1); }
      50% { transform: translateX(-50%) scale(1.05); }
    }

    /* ------------------------------------------------------------- */
    /* ACTIVE STATE: OPEN & ZOOM IN                                  */
    /* ------------------------------------------------------------- */
    .scene.is-open .envelope-flap-wrapper {
      transform: rotateX(178deg);
      z-index: 2;
    }

    .scene.is-open .flap-face {
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.15));
    }

    .scene.is-open .monogram-seal {
      opacity: 0;
      pointer-events: none;
    }

    .scene.is-open .inner-glow {
      opacity: 1;
    }

    /* Inner card slides UP out of pocket, scales & zooms in */
    .scene.is-open .inner-card {
      transform: translateY(-40px) scale(1.16);
      z-index: 30;
      box-shadow: 0 35px 80px rgba(0, 0, 0, 0.65), 0 0 0 1px rgba(212, 175, 98, 0.35);
      opacity: 1;
    }

    .scene.is-open .envelope-pocket {
      opacity: 0.85;
    }

    /* Floating control bar */
    .control-bar {
      margin-top: 25px;
      display: flex;
      gap: 14px;
      z-index: 100;
    }

    .btn {
      padding: 10px 22px;
      background: #2b2721;
      border: 1px solid #4a4234;
      color: #ede4d5;
      font-size: 13.5px;
      border-radius: 25px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.25s ease;
      font-family: 'Montserrat', sans-serif;
    }

    .btn:hover {
      background: var(--gold-primary);
      color: #151412;
      border-color: var(--gold-primary);
      box-shadow: 0 4px 16px rgba(203, 163, 76, 0.4);
    }
  </style>
</head>
<body>
  <div class="header-bar">
    <h1>Khmer Wedding Invitation</h1>
    <p class="hint" id="status-hint">✨ Tap the envelope or gold seal to open & zoom in</p>
  </div>

  <div class="scene" id="scene" onclick="toggleOpen()">
    <div class="envelope-stage">
      <!-- 1. Back cavity with golden radiance -->
      <div class="envelope-back">
        <div class="inner-glow"></div>
      </div>

      <!-- 2. Inner Invitation Card that slides up and zooms in -->
      <div class="inner-card">
        <img src="/wedding-floral-frame.jpg" alt="Floral Invitation Card" class="inner-card-bg">
        <div class="card-content">
          <div class="card-monogram">S&S</div>
          <div class="card-tagline">Together with their families</div>
          <div class="card-couple">
            Sonton
            <span class="card-ampersand">&</span>
            Santini
          </div>
          <div class="card-khmer">សិរីសួស្តី អាពាហ៍ពិពាហ៍</div>
          <div class="card-divider"></div>
          <div class="card-date">
            SATURDAY
            <span class="card-date-hl">FEBRUARY 14, 2026</span>
            PHNOM PENH, CAMBODIA
          </div>
        </div>
      </div>

      <!-- 3. Lower Envelope Pocket (holds card) -->
      <div class="envelope-pocket">
        <img src="/envelope-pocket.png" alt="Envelope Pocket">
      </div>

      <!-- 4. Top Folding Flap with Scalloped Lace Contour -->
      <div class="envelope-flap-wrapper">
        <div class="flap-face">
          <img src="/envelope-flap.png" alt="Scalloped Envelope Flap">
        </div>
        <div class="flap-back"></div>
        <div class="monogram-seal">
          <img src="/gold-seal.svg" alt="Gold Monogram Seal">
        </div>
      </div>
    </div>
  </div>

  <div class="control-bar">
    <button class="btn" onclick="toggleOpen(); event.stopPropagation();" id="toggle-btn">Open & Zoom In</button>
    <button class="btn" onclick="resetEnvelope(); event.stopPropagation();">Reset</button>
  </div>

  <script>
    const scene = document.getElementById('scene');
    const hint = document.getElementById('status-hint');
    const toggleBtn = document.getElementById('toggle-btn');

    function toggleOpen() {
      const isOpen = scene.classList.toggle('is-open');
      if (isOpen) {
        hint.textContent = '🎉 Invitation opened! Tap anywhere to fold closed.';
        toggleBtn.textContent = 'Close Envelope';
      } else {
        hint.textContent = '✨ Tap the envelope or gold seal to open & zoom in';
        toggleBtn.textContent = 'Open & Zoom In';
      }
    }

    function resetEnvelope() {
      scene.classList.remove('is-open');
      hint.textContent = '✨ Tap the envelope or gold seal to open & zoom in';
      toggleBtn.textContent = 'Open & Zoom In';
    }
  </script>
</body>
</html>
