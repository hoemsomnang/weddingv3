<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="seal-gold" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fff6d1" />
      <stop offset="25%" stop-color="#f5d77f" />
      <stop offset="60%" stop-color="#c9972a" />
      <stop offset="85%" stop-color="#996a12" />
      <stop offset="100%" stop-color="#694506" />
    </radialGradient>
    <radialGradient id="inner-gold-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fefae0" />
      <stop offset="70%" stop-color="#f4e5b8" />
      <stop offset="100%" stop-color="#dec27b" />
    </radialGradient>
    <filter id="seal-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#4a3713" flood-opacity="0.38" />
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#3b2b0c" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Outer Filigree Scalloped Mandala Ring -->
  <g filter="url(#seal-shadow)">
    <!-- 24-point scalloped star / sunburst border -->
    <path d="
      M 100,6
      L 106,16 L 118,10 L 122,22 L 135,18 L 137,30 L 150,29 L 149,41 L 162,43 L 158,55 L 170,60 L 163,71 L 174,78 L 165,88 L 174,97 L 163,105 L 170,116 L 157,122 L 162,133 L 148,137 L 150,149 L 136,151 L 134,163 L 121,162 L 117,173 L 105,170 L 99,180
      L 93,170 L 81,173 L 77,162 L 64,163 L 62,151 L 48,149 L 50,137 L 36,133 L 41,122 L 28,116 L 35,105 L 24,97 L 33,88 L 24,78 L 35,71 L 28,60 L 40,55 L 36,43 L 49,41 L 48,29 L 61,30 L 63,18 L 76,22 L 80,10 L 92,16 Z" 
      fill="url(#seal-gold)" stroke="#fff3b8" stroke-width="1.2" />

    <!-- Outer Raised Beaded Ring -->
    <circle cx="100" cy="98" r="66" fill="url(#seal-gold)" stroke="#52390a" stroke-width="1.5" />
    <circle cx="100" cy="98" r="62" fill="none" stroke="#ffe794" stroke-width="1" stroke-dasharray="3 3" />
    
    <!-- Inner Recessed Medallion Bed -->
    <circle cx="100" cy="98" r="54" fill="url(#inner-gold-glow)" stroke="#b88926" stroke-width="2" />
    
    <!-- Monogram Initial Glyphs (S & S / Khmer Motif) -->
    <g transform="translate(100, 98) scale(0.95)" fill="url(#seal-gold)" stroke="#6e4a06" stroke-width="0.8">
      <!-- Ornate Monogram S & S / Khmer Knot Style -->
      <path d="M -18,-24 C -6,-32 18,-32 24,-18 C 28,-10 24,-2 14,3 C 3,8 -12,12 -12,22 C -12,30 2,34 14,30 C 22,27 26,20 28,15 L 34,18 C 30,27 22,37 8,37 C -8,37 -22,30 -22,17 C -22,4 -7,-2 3,-7 C 15,-12 18,-17 18,-23 C 18,-29 6,-30 -8,-24 Z" />
      <circle cx="0" cy="0" r="3.5" fill="#ffffff" />
    </g>
  </g>
</svg>
