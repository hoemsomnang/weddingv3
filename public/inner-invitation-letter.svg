<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 1200" width="100%" height="100%">
  <defs>
    <radialGradient id="letter-bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f8f7f2" />
      <stop offset="100%" stop-color="#ede9df" />
    </radialGradient>
    <linearGradient id="gold-hairline" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8ca79" />
      <stop offset="50%" stop-color="#caa34e" />
      <stop offset="100%" stop-color="#936d22" />
    </linearGradient>
    <radialGradient id="seal-gold-inner" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fff8d6" />
      <stop offset="30%" stop-color="#f5d678" />
      <stop offset="70%" stop-color="#c9972a" />
      <stop offset="100%" stop-color="#7a5109" />
    </radialGradient>
    <filter id="letter-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#382f22" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Letter Paper Card -->
  <rect x="10" y="10" width="680" height="1180" rx="16" fill="url(#letter-bg)" stroke="#e2ded4" stroke-width="1.5" filter="url(#letter-shadow)" />

  <!-- Outer Gold Border -->
  <rect x="35" y="35" width="630" height="1130" rx="10" fill="none" stroke="url(#gold-hairline)" stroke-width="1.8" />
  <!-- Inner Gold Hairline -->
  <rect x="43" y="43" width="614" height="1114" rx="7" fill="none" stroke="url(#gold-hairline)" stroke-width="0.8" stroke-dasharray="6 4" opacity="0.75" />

  <!-- Corner Filigree Ornaments -->
  <g stroke="url(#gold-hairline)" stroke-width="1.5" fill="none">
    <!-- Top-Left Corner -->
    <path d="M 43,80 C 65,80 80,65 80,43" />
    <path d="M 43,90 C 75,90 90,75 90,43" />
    <circle cx="85" cy="85" r="3" fill="#caa34e" />

    <!-- Top-Right Corner -->
    <path d="M 657,80 C 635,80 620,65 620,43" />
    <path d="M 657,90 C 625,90 610,75 610,43" />
    <circle cx="615" cy="85" r="3" fill="#caa34e" />

    <!-- Bottom-Left Corner -->
    <path d="M 43,1120 C 65,1120 80,1135 80,1157" />
    <path d="M 43,1110 C 75,1110 90,1125 90,1157" />
    <circle cx="85" cy="1115" r="3" fill="#caa34e" />

    <!-- Bottom-Right Corner -->
    <path d="M 657,1120 C 635,1120 620,1135 620,1157" />
    <path d="M 657,1110 C 625,1110 610,1125 610,1157" />
    <circle cx="615" cy="1115" r="3" fill="#caa34e" />
  </g>

  <!-- Top Monogram Crest -->
  <g transform="translate(350, 150)">
    <circle cx="0" cy="0" r="44" fill="none" stroke="url(#gold-hairline)" stroke-width="1.8" />
    <circle cx="0" cy="0" r="40" fill="none" stroke="url(#gold-hairline)" stroke-width="0.8" stroke-dasharray="3 3" />
    <circle cx="0" cy="0" r="34" fill="#fcfbf7" stroke="url(#gold-hairline)" stroke-width="1.2" />
    <text x="0" y="8" font-family="'Cinzel', serif" font-size="20" font-weight="600" fill="#936d22" text-anchor="middle" letter-spacing="4">S&amp;S</text>
  </g>

  <!-- Khmer Header Title -->
  <text x="350" y="250" font-family="'Moul', serif" font-size="24" fill="#9b7324" text-anchor="middle">សិរីសួស្តី អាពាហ៍ពិពាហ៍</text>
  
  <text x="350" y="300" font-family="'Cinzel', serif" font-size="13" letter-spacing="5" fill="#8c7f6b" text-anchor="middle">WEDDING INVITATION</text>

  <!-- Khmer Request Invitation Line -->
  <text x="350" y="360" font-family="'Kantumruy Pro', sans-serif" font-size="16" fill="#6d6250" text-anchor="middle">សូមគោរពអញ្ជើញ ឯកឧត្តម លោកជំទាវ លោក លោកស្រី</text>
  <text x="350" y="395" font-family="'Kantumruy Pro', sans-serif" font-size="15" fill="#6d6250" text-anchor="middle">ចូលរួមជាអធិបតី និងជាភ្ញៀវកិត្តិយស ក្នុងពិធីមង្គលការ</text>

  <!-- Divider Ribbon -->
  <g stroke="url(#gold-hairline)" stroke-width="1" fill="none">
    <line x1="220" y1="440" x2="310" y2="440" />
    <line x1="390" y1="440" x2="480" y2="440" />
    <polygon points="350,436 354,440 350,444 346,440" fill="#caa34e" />
  </g>

  <!-- Couple Names (Large Romantic Calligraphy) -->
  <text x="350" y="540" font-family="'Great Vibes', cursive" font-size="64" fill="#936d22" text-anchor="middle">Sonton</text>
  <text x="350" y="595" font-family="'Cinzel', serif" font-size="26" fill="#caa34e" text-anchor="middle">&amp;</text>
  <text x="350" y="675" font-family="'Great Vibes', cursive" font-size="64" fill="#936d22" text-anchor="middle">Santini</text>

  <!-- Divider Ribbon 2 -->
  <g stroke="url(#gold-hairline)" stroke-width="1" fill="none">
    <line x1="220" y1="740" x2="310" y2="740" />
    <line x1="390" y1="740" x2="480" y2="740" />
    <polygon points="350,736 354,740 350,744 346,740" fill="#caa34e" />
  </g>

  <!-- Ceremony Details & Date -->
  <text x="350" y="800" font-family="'Cinzel', serif" font-size="14" letter-spacing="4" fill="#8c7f6b" text-anchor="middle">SATURDAY</text>
  <text x="350" y="845" font-family="'Cinzel', serif" font-size="26" font-weight="700" letter-spacing="3" fill="#8f691d" text-anchor="middle">FEBRUARY 14, 2026</text>
  <text x="350" y="890" font-family="'Kantumruy Pro', sans-serif" font-size="17" fill="#6d6250" text-anchor="middle">វេលាម៉ោង ៥:០០ រសៀល</text>
  <text x="350" y="930" font-family="'Cinzel', serif" font-size="14" letter-spacing="3" fill="#8c7f6b" text-anchor="middle">PHNOM PENH, CAMBODIA</text>

  <!-- Closing Seal/Badge -->
  <g transform="translate(350, 1030)">
    <rect x="-110" y="-18" width="220" height="36" rx="18" fill="#caa34e" opacity="0.15" />
    <rect x="-110" y="-18" width="220" height="36" rx="18" fill="none" stroke="url(#gold-hairline)" stroke-width="1" />
    <text x="0" y="6" font-family="'Kantumruy Pro', sans-serif" font-size="14" font-weight="600" fill="#936d22" text-anchor="middle">សូមអរគុណ (Thank You)</text>
  </g>
</svg>
