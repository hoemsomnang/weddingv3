<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 160" width="80" height="160" class="svg-curtain-tassel">
  <defs>
    <linearGradient id="goldCord" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff59d" />
      <stop offset="35%" stop-color="#ffd700" />
      <stop offset="70%" stop-color="#c69214" />
      <stop offset="100%" stop-color="#7a5506" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="rgba(0,0,0,0.5)" />
    </filter>
  </defs>

  <g filter="url(#goldGlow)">
    <!-- Braided Rope Band -->
    <path d="M10,25 C30,45 50,45 70,25 C75,32 75,38 70,45 C50,65 30,65 10,45 Z" fill="url(#goldCord)" stroke="#5d4002" stroke-width="0.8"/>
    <!-- Central Knot -->
    <ellipse cx="40" cy="58" rx="14" ry="11" fill="url(#goldCord)" stroke="#5d4002" stroke-width="1"/>
    <ellipse cx="40" cy="58" rx="8" ry="6" fill="#fff59d" opacity="0.6"/>
    <!-- Hanging Cap -->
    <path d="M28,68 C28,65 52,65 52,68 L56,82 C56,84 24,84 24,82 Z" fill="url(#goldCord)" stroke="#5d4002" stroke-width="0.8"/>
    <!-- Tassel Fringe Skirt -->
    <path d="M24,84 L14,145 C14,152 66,152 66,145 L56,84 Z" fill="url(#goldCord)" stroke="#5d4002" stroke-width="0.8"/>
    <!-- Vertical Fringe Lines -->
    <line x1="28" y1="86" x2="24" y2="146" stroke="#fff8e1" stroke-width="0.8" opacity="0.8"/>
    <line x1="34" y1="86" x2="32" y2="148" stroke="#5d4002" stroke-width="0.8" opacity="0.6"/>
    <line x1="40" y1="86" x2="40" y2="150" stroke="#fff8e1" stroke-width="1" opacity="0.9"/>
    <line x1="46" y1="86" x2="48" y2="148" stroke="#5d4002" stroke-width="0.8" opacity="0.6"/>
    <line x1="52" y1="86" x2="56" y2="146" stroke="#fff8e1" stroke-width="0.8" opacity="0.8"/>
  </g>
</svg>
